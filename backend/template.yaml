AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Local event registration API. Not a deployment template for this milestone.

Resources:
  LocalHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - http://localhost:5173
          - http://127.0.0.1:5173
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Content-Type, X-CSRF-Token, Idempotency-Key]
        ExposeHeaders: [Location, Idempotent-Replayed]
        AllowCredentials: true
        MaxAge: 600

  EventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: app.lambda_handler
      Runtime: python3.13
      Architectures: [x86_64]
      # Local bind mounts on Windows/OneDrive can make SDK model loading slow.
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: ""
          DYNAMODB_TABLE: fcaj-event-workshop-local
          DYNAMODB_REGION: us-east-1
          ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
          COOKIE_SECURE: "false"
          USER_AUTH_WINDOW_SECONDS: "900"
          USER_LOGIN_IP_LIMIT: "120"
          USER_LOGIN_ACCOUNT_LIMIT: "10"
          USER_SIGNUP_IP_LIMIT: "120"
      Events:
        BuyerRegister:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /auth/register
            Method: POST
            PayloadFormatVersion: "2.0"
        BuyerLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /auth/login
            Method: POST
            PayloadFormatVersion: "2.0"
        BuyerSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /auth/session
            Method: GET
            PayloadFormatVersion: "2.0"
        BuyerLogout:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /auth/logout
            Method: POST
            PayloadFormatVersion: "2.0"
        BuyerTickets:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /me/registrations
            Method: GET
            PayloadFormatVersion: "2.0"
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /health
            Method: GET
            PayloadFormatVersion: "2.0"
        Events:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /events
            Method: GET
            PayloadFormatVersion: "2.0"
        EventDetail:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /events/{eventId}
            Method: GET
            PayloadFormatVersion: "2.0"
        CreateRegistration:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /events/{eventId}/registrations
            Method: POST
            PayloadFormatVersion: "2.0"
        RegistrationResult:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /registrations/{registrationId}
            Method: GET
            PayloadFormatVersion: "2.0"
        AdminLogin:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /admin/login
            Method: POST
            PayloadFormatVersion: "2.0"
        AdminSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /admin/session
            Method: GET
            PayloadFormatVersion: "2.0"
        AdminLogout:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /admin/logout
            Method: POST
            PayloadFormatVersion: "2.0"
        AdminEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /admin/events
            Method: GET
            PayloadFormatVersion: "2.0"
        AdminCreateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /admin/events
            Method: POST
            PayloadFormatVersion: "2.0"
        AdminUpdateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /admin/events/{eventId}
            Method: PUT
            PayloadFormatVersion: "2.0"
        AdminDeleteEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref LocalHttpApi
            Path: /admin/events/{eventId}
            Method: DELETE
            PayloadFormatVersion: "2.0"
